name: Check Pages setup

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "GET response:"
            gh api --include "repos/${GITHUB_REPOSITORY}/pages"
            echo
            echo "POST response:"
            gh api --include --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          } > pages-setup.log 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan pages-setup
          git rm -rf --quiet .
          git add pages-setup.log
          git commit -m "Record Pages setup response"
          git push --force origin pages-setup